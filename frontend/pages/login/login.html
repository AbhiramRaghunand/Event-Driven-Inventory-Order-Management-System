<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Inventory Management System</title>

    <link
        rel="stylesheet"
        href="/assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/page-assets/login/login.css"
    >

</head>


<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="brand">

            <div class="brand-mark">
                IM
            </div>

            <div class="brand-text">

                <h1>
                    Inventory Management
                </h1>

                <p>
                    Enterprise Inventory & Order System
                </p>

            </div>

        </div>


        <div class="auth-heading">

            <h2>
                Welcome back
            </h2>

            <p>
                Sign in to access your account.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="primary-button"
            >
                Sign In
            </button>


            <p
                id="loginMessage"
                class="message"
            ></p>

        </form>


        <div class="auth-footer">

            <span>
                Don't have an account?
            </span>

            <a href="/register">
                Create an account
            </a>

        </div>

    </section>

</main>


<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/page-assets/login/login.js"></script>

</body>

</html>
